[build]
  command = "node scripts/build-site.mjs"
  publish = "dist"

# Keep the public URL format aligned with the canonical tags and sitemap.
# Netlify's Pretty URLs processing otherwise exposes both /page and /page.html,
# and rewrites /page.html/ to the non-canonical extensionless version.
[build.processing.html]
  pretty_urls = false

# Consolidate every hostname signal on the canonical www site.
[[redirects]]
  from = "https://adelieconstruction.com/*"
  to = "https://www.adelieconstruction.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/index.html"
  to = "/"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "SAMEORIGIN"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

[[headers]]
  for = "/assets/*"
  [headers.values]
    # Asset filenames are stable rather than content-hashed, so allow updates to
    # propagate without leaving returning visitors on a year-old CSS/image copy.
    Cache-Control = "public, max-age=604800, stale-while-revalidate=86400"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
